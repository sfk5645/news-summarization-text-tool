# Deploy to a VPS on every push to main (or manual run).
#
# Required GitHub repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_HOST      — server hostname or IP
#   DEPLOY_USER      — SSH user
#   DEPLOY_SSH_KEY   — private key whose public half is in ~/.ssh/authorized_keys on the server
#   DEPLOY_PATH      — absolute path to the git clone on the server
#                      (e.g. /home/you/news-summarization-text-tool)
#
# Optional secrets:
#   DEPLOY_PORT      — SSH port (default 22)
#   DEPLOY_BRANCH    — branch to pull (default main)

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_BRANCH: ${{ secrets.DEPLOY_BRANCH }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_BRANCH
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export DEPLOY_BRANCH="${DEPLOY_BRANCH:-main}"
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh
